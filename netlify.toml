[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,README-"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["fastify", "@fastify/cors", "pg"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
